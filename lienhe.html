<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 3 - Form Liên Hệ Đẹp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }

        /* Định dạng lại cấu trúc hàng dọc để nhét thông báo lỗi xuống dưới */
        .form-group {
            margin-bottom: 15px;
            width: 500px;
        }

        .input-row {
            display: flex;
            align-items: center;
        }

        input {
            flex: 1;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* Khi có lỗi thì viền ô nhập liệu đổi sang màu đỏ */
        input.input-error, textarea.input-error {
            border: 1px solid red;
            background-color: #fff6f6;
        }

        label {
            width: 100px;
            font-weight: bold;
        }

        /* Dấu sao đỏ báo hiệu trường bắt buộc */
        .required {
            color: red;
            margin-left: 3px;
        }

        /* Định dạng dòng thông báo lỗi phía dưới ô nhập */
        .error-msg {
            color: red;
            font-size: 13px;
            margin-left: 100px; /* Thụt lề bằng chiều rộng của label để thẳng hàng với ô input */
            margin-top: 4px;
            display: none; /* Mặc định ẩn đi, khi có lỗi mới hiện */
        }

        .menu a {
            text-decoration: none;
            color: black;
        }

        .menu a:hover {
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 80px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 6px;
        }

        .btn-group {
            margin-left: 100px;
            margin-top: 15px;
        }

        .btn-group button {
            padding: 8px 20px;
            margin-right: 10px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }

        #btnGui { background-color: #28a745; color: white; }
        #btnXoa { background-color: #dc3545; color: white; }

        .discuss-img {
            margin-top: 30px;
            width: 200px;
            cursor: pointer;
            transition: filter 0.3s ease;
        }

        .invert-effect {
            filter: invert(100%);
        }
    </style>
</head>

<body>
    <div class="menu"><a href="menu.html">Về Trang chủ</a></div>
    
    <div style="margin-top: 20px;">
        <div class="form-group">
            <div class="input-row">
                <label>Họ tên:<span class="required">*</span></label> 
                <input type="text" id="txtHoTen" placeholder="họ tên viết hoa">
            </div>
            <div class="error-msg" id="errHoTen">Họ và tên không được để trống!</div>
        </div>

        <div class="form-group">
            <div class="input-row">
                <label>MSSV:<span class="required">*</span></label>
                <input type="text" id="txtMSSV" placeholder="vidu: DH52300347">
            </div>
            <div class="error-msg" id="errMSSV">MSSV phải gồm đúng 10 ký tự và bắt đầu bằng DH5!</div>
        </div>

        <div class="form-group">
            <div class="input-row" style="align-items: flex-start;">
                <label>Lời nhắn:</label>
                <textarea id="txtLoiNhan" placeholder="lời nhắn"></textarea>
            </div>
        </div>

        <div class="btn-group">
            <button type="button" id="btnGui">Gửi</button>
            <button type="button" id="btnXoa">Xóa</button>
        </div>
    </div>

    <div>
        <img src="discussing.jpg" alt="Discussing Image" class="discuss-img" id="imgDiscuss">
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var txtHoTen = document.getElementById("txtHoTen");
            var txtMSSV = document.getElementById("txtMSSV");
            var txtLoiNhan = document.getElementById("txtLoiNhan");
            var btnGui = document.getElementById("btnGui");
            var btnXoa = document.getElementById("btnXoa");
            var imgDiscuss = document.getElementById("imgDiscuss");

            // Các thẻ chứa câu lỗi công cộng
            var errHoTen = document.getElementById("errHoTen");
            var errMSSV = document.getElementById("errMSSV");

            // --- CÂU 1: Xử lý trường Họ và tên khi mất focus (blur) ---
            txtHoTen.addEventListener("blur", function () {
                var val = txtHoTen.value.trim();

                if (val === "") {
                    // Hiện câu thông báo lỗi bên dưới
                    errHoTen.style.display = "block";
                    txtHoTen.classList.add("input-error");
                    
                    // Focus lại vị trí sai
                    setTimeout(function() {
                        txtHoTen.focus();
                    }, 10);
                } else {
                    // Nếu hợp lệ: Ẩn lỗi, xóa viền đỏ và chuyển IN HOA
                    errHoTen.style.display = "none";
                    txtHoTen.classList.remove("input-error");
                    txtHoTen.value = val.toUpperCase();
                }
            });

            // --- CÂU 2: Kiểm tra MSSV (Xử lý khi nhấn nút Gửi) ---
            btnGui.addEventListener("click", function () {
                var hoTenVal = txtHoTen.value.trim();
                var mssvVal = txtMSSV.value.trim();
                var regexMSSV = /^DH5\d{7}$/;
                var hopLe = true;

                // Kiểm tra lại Họ Tên đề phòng người dùng bỏ qua bước blur
                if (hoTenVal === "") {
                    errHoTen.style.display = "block";
                    txtHoTen.classList.add("input-error");
                    txtHoTen.focus();
                    hopLe = false;
                    return; // Dừng xử lý tiếp
                }

                // Kiểm tra định dạng MSSV
                if (!regexMSSV.test(mssvVal)) {
                    errMSSV.style.display = "block"; // Hiện thông báo lỗi dưới ô MSSV
                    txtMSSV.classList.add("input-error"); // Đổi viền ô sang đỏ
                    txtMSSV.focus(); // Trỏ chuột vào ô sai
                    hopLe = false;
                } else {
                    errMSSV.style.display = "none";
                    txtMSSV.classList.remove("input-error");
                }

                // Nếu tất cả các trường đều hợp lệ
                if (hopLe) {
                    alert("Gửi dữ liệu thành công!");
                }
            });

            // --- Xử lý nút Xóa (Reset toàn bộ trạng thái) ---
            btnXoa.addEventListener("click", function () {
                if (confirm("Bạn muốn xóa hết nhập liệu chứ?")) {
                    // Xóa chữ
                    txtHoTen.value = "";
                    txtMSSV.value = "";
                    txtLoiNhan.value = "";
                    
                    // Ẩn toàn bộ trạng thái lỗi cũ
                    errHoTen.style.display = "none";
                    errMSSV.style.display = "none";
                    txtHoTen.classList.remove("input-error");
                    txtMSSV.classList.remove("input-error");
                }
            });

            // --- CÂU 3: Click hình ảnh "discussing.jpg" đổi màu ---
            var isInverted = false;
            imgDiscuss.addEventListener("click", function () {
                if (!isInverted) {
                    alert("Đảo màu hình");
                    imgDiscuss.classList.add("invert-effect");
                    isInverted = true;
                } else {
                    alert("Về mặc định");
                    imgDiscuss.classList.remove("invert-effect");
                    isInverted = false;
                }
            });
        });
    </script>
</body>

</html>
